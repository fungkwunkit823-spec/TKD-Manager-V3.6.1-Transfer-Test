<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TKD Manager V3.6.1｜獨立轉班測試台</title>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172b4d;background:#f2f5fa}body{margin:0}header{background:#153b70;color:white;padding:22px 16px}main{max-width:780px;margin:20px auto;padding:0 14px}.panel{background:white;padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 9px #18345a13}h1{font-size:1.4rem;margin:0 0 7px}h2{font-size:1.15rem;margin-top:0}label{display:block;font-weight:600;margin:14px 0 5px}input,select,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border-radius:9px;border:1px solid #aab6c7}button{border:0;background:#173b73;color:white;font-weight:600;cursor:pointer;margin-top:12px}button:disabled{opacity:.45;cursor:not-allowed}.danger{background:#a62d36}.muted{color:#52677b;font-size:.9rem}.status{white-space:pre-wrap;overflow-wrap:anywhere}.warning{border-left:4px solid #b07a16;padding:10px;background:#fff8e7}.ok{color:#136b42}.fail{color:#a62d36}#sessionInfo{font-size:.9rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf4fc;padding:12px;border-radius:9px}footer{text-align:center;color:#64748b;padding:25px}</style></head>
<body><header><h1>🥋 TKD Manager V3.6.1 — 學生轉班測試台</h1><div>ISOLATED TEST ONLY · 非正式 V3.6 網站</div></header><main>
<section class="panel warning"><strong>安全隔離</strong><p class="muted">本頁面會拒絕連線到已知正式 V3.6 / V3.5B Supabase 專案。必須使用另一個獨立 Supabase 測試專案、測試管理員及合成測試學生。唔好連真實學生資料庫。</p><div id="connection" class="status">正在檢查測試設定…</div></section>
<section class="panel"><h2>1. 測試管理員登入</h2><label for="email">測試帳戶電郵</label><input id="email" type="email" autocomplete="username"><label for="password">測試帳戶密碼</label><input id="password" type="password" autocomplete="current-password"><button id="login" disabled>登入測試資料庫</button><button id="logout" disabled>登出</button><p class="status" id="sessionInfo"></p></section>
<section class="panel"><h2>2. 預覽學生轉班</h2><p class="muted">示例：荔枝角二 → 寶琳五。系統會核對身份、報班、點名、學費紀錄；有歷史資料會拒絕直接更改。</p><label for="student">學生（測試資料）</label><select id="student" disabled></select><label for="source">目前班別</label><select id="source" disabled></select><label for="target">目標班別</label><select id="target" disabled></select><label for="reason">轉班原因（3–500 字）</label><textarea id="reason" rows="3" maxlength="500" placeholder="例如：測試案例 — 誤選班別，修正報班關係"></textarea><button id="preview" disabled>先預覽風險（不修改）</button><pre id="previewResult">尚未預覽</pre><button id="commit" class="danger" disabled>確認正式更改（只限獨立測試資料庫）</button><p id="status" class="status"></p></section>
</main><footer>V3.6.1 isolated transfer console · 不含任何正式學生資料</footer>
<script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const prodUrls=new Set(['https://kmqddfelcrfprbanckwp.supabase.co','https://ozfpjdpwftdcmkvjwnhf.supabase.co']);
const prodAdmins=new Set(['434b026e-d238-4f28-89f8-94ffd88cec47','9b4ad845-9491-4c30-84b4-be0db7d2a103']);
const cfg=window.TKD_V361_TEST||{};
const url=String(cfg.url||'').replace(/\/$/,'');
const safe=/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)&&!prodUrls.has(url)&&String(cfg.publishableKey||'').startsWith('sb_publishable_')&&!prodAdmins.has(String(cfg.adminUid||''))&&/^[a-f0-9-]{36}$/i.test(String(cfg.adminUid||''))&&cfg.adminUid!=='00000000-0000-0000-0000-000000000000';
const msg=(id,text,good=false)=>{$(id).textContent=text;$(id).className='status '+(good?'ok':'fail')};
let db=null,user=null,people=[],classes=[],enrollments=[],ready=false,lastPreview=null,busy=false;
const setButtons=()=>{$('login').disabled=!safe||busy;$('logout').disabled=!user||busy;for(const id of ['student','source','target','preview'])$(id).disabled=!ready||busy;$('commit').disabled=!ready||busy||!lastPreview;};
function invalidate(){lastPreview=null;$('commit').disabled=true;$('previewResult').textContent='選項已變更，必須重新預覽。';}
function populate(id,rows,label){const el=$(id);el.replaceChildren();for(const row of rows){const o=document.createElement('option');o.value=row.id;o.textContent=row[label];el.append(o);}}
async function listAll(table,columns){const all=[];for(let from=0;from<2000;from+=500){const {data,error}=await db.from(table).select(columns).order('id').range(from,from+499);if(error)throw error;all.push(...(data||[]));if(!data||data.length<500)break;}return all;}
async function load(){ready=false;setButtons();try{
 const [pp,cc,ee]=await Promise.all([listAll('students','id,student_name'),listAll('classes','id,class_name,is_active'),listAll('student_classes','id,student_id,class_id,left_on')]);
 people=pp;classes=cc;enrollments=ee;populate('student',people,'student_name');populate('source',classes,'class_name');populate('target',classes.filter(c=>c.is_active),'class_name');
 const source=classes.find(c=>c.class_name==='荔枝角二'),target=classes.find(c=>c.class_name==='寶琳五');if(source)$('source').value=source.id;if(target)$('target').value=target.id;
 ready=true;invalidate();msg('status',`已載入 ${people.length} 名測試學生、${classes.length} 個班別。請選擇測試學生。`,true);
 }catch(e){msg('status','讀取資料失敗：'+e.message);}finally{setButtons();}}
if(!safe){msg('connection','已封鎖：config.js 未設為有效獨立測試專案，或指向已知正式專案。');}
else if(!window.supabase){msg('connection','Supabase JS 未載入，請檢查網絡。');}
else{db=window.supabase.createClient(url,cfg.publishableKey);msg('connection','測試專案格式通過；仍須確認該專案沒有真實學生資料。',true);setButtons();}
$('login').addEventListener('click',async()=>{if(!db)return;busy=true;setButtons();try{
 const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;
 if(data.user?.id!==cfg.adminUid){await db.auth.signOut();throw Error('登入 UID 不符合獨立測試管理員');}
 user=data.user;$('password').value='';msg('sessionInfo','測試管理員已登入',true);await load();
 }catch(e){msg('sessionInfo','登入失敗：'+e.message);}finally{busy=false;setButtons();}});
$('logout').addEventListener('click',async()=>{if(db)await db.auth.signOut();user=null;ready=false;invalidate();msg('sessionInfo','已登出');setButtons();});
for(const id of ['student','source','target','reason'])$(id).addEventListener('input',invalidate);
function args(dry){return{p_student_id:$('student').value,p_from_class_id:$('source').value,p_to_class_id:$('target').value,p_reason:$('reason').value.trim(),p_dry_run:dry};}
function validate(){if(!user||!ready)throw Error('請先登入並載入測試資料');if(!$('student').value||!$('source').value||!$('target').value||$('source').value===$('target').value)throw Error('請選擇學生及不同的新舊班別');if($('reason').value.trim().length<3)throw Error('請輸入至少 3 字原因');if(!enrollments.some(e=>e.student_id===$('student').value&&e.class_id===$('source').value&&!e.left_on))throw Error('所選學生未正在報讀來源班別');}
$('preview').addEventListener('click',async()=>{busy=true;setButtons();try{validate();const a=args(true);const {data,error}=await db.rpc('tkd_v361_transfer_student',a);if(error)throw error;lastPreview=a;$('previewResult').textContent=JSON.stringify(data,null,2);msg('status','只讀預覽成功；尚未修改任何資料。',true);}catch(e){invalidate();msg('status','預覽拒絕：'+e.message);}finally{busy=false;setButtons();}});
$('commit').addEventListener('click',async()=>{if(!lastPreview||busy)return;const a=args(false);if(JSON.stringify({...a,p_dry_run:true})!==JSON.stringify(lastPreview)){invalidate();return;}
 const person=people.find(p=>p.id===a.p_student_id)?.student_name||'測試學生';const from=classes.find(c=>c.id===a.p_from_class_id)?.class_name;const to=classes.find(c=>c.id===a.p_to_class_id)?.class_name;
 if(!confirm(`只限獨立測試專案：確認將「${person}」由「${from}」改為「${to}」？`))return;
 busy=true;setButtons();try{const {data,error}=await db.rpc('tkd_v361_transfer_student',a);if(error)throw error;msg('status','測試轉班成功。審計 ID：'+data.audit_id,true);await load();}catch(e){msg('status','轉班未能確認：'+e.message+'。如逾時，請先重新整理，避免重複操作。');invalidate();}finally{busy=false;setButtons();}});
</script></body></html>
